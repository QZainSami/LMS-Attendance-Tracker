<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CMS Attendance</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 670px;
      padding: 14px 16px;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .header h2 { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .header-info { display: flex; gap: 12px; align-items: center; }
    .sync-tag { font-size: 0.72rem; color: var(--text-muted); }
    .target-tag { font-size: 0.74rem; color: var(--accent); font-weight: 600; }

    #attendance-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .course-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
    }
    .course-card:hover { border-color: #475569; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
    }
    .title-area { flex: 1; min-width: 0; }
    .course-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-sub { font-size: 0.70rem; color: var(--text-muted); margin-top: 2px; }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .badge-good { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background-color: #334155;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .card-metrics {
      display: grid;
      grid-template-columns: 0.9fr 1fr 1.3fr;
      gap: 4px;
      font-size: 0.72rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .metric-label { color: var(--text-muted); display: block; font-size: 0.64rem; }
    .metric-val { font-weight: 600; color: #e2e8f0; }

    .bottom-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-refresh {
      flex: 1;
      padding: 9px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-refresh:hover { background-color: #0369a1; }
    .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: right;
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Attendance Dashboard</h2>
    <div class="header-info">
      <span id="sync-status" class="sync-tag">Auto-Sync Active</span>
      <span class="target-tag">Target: 75%</span>
    </div>
  </div>

  <div id="attendance-list">
    <p style="font-size:0.8rem; color:#94a3b8; grid-column: span 2; text-align:center;">Loading attendance...</p>
  </div>

  <div class="bottom-bar">
    <button id="refresh-button" class="btn-refresh">Manual Refresh</button>
    <div class="footer">
      <div>Theory: 3 Cr = 12h | 2 Cr = 8h max</div>
      <div>Labs: 1 Cr = 12h (4 sessions) max</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
